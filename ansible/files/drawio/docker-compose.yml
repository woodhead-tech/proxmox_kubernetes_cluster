# docker-compose.yml - draw.io self-hosted diagramming app
#
# Uses the official jgraph/drawio image (Jetty-based, port 8080).
# Stateless — no persistent volumes; diagrams are saved client-side as .drawio files.

services:
  drawio:
    image: jgraph/drawio:latest
    container_name: drawio
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
