# docker-compose.yml - Immich self-hosted photo/video library
#
# Official Immich stack: server + machine-learning + redis + postgres (pgvecto-rs)
# Photos/videos stored at /opt/immich/photos (bind mount, not Docker volume).
# ML model cache stored at /opt/immich/model-cache (persisted across restarts).
#
# Environment variables are loaded from /opt/immich/.env:
#   IMMICH_VERSION   - image tag (e.g. "release" or specific version)
#   DB_PASSWORD      - postgres password (generated by setup-immich.yml)
#   JWT_SECRET       - 32-byte base64 secret (generated by setup-immich.yml)
#
# Expose port 2283 on localhost only — Traefik terminates TLS externally.
# Access: https://photos.woodhead.tech (via Traefik + Authentik)

name: immich

services:
  # --- Immich Server ---
  # Handles API, web UI, asset ingest, and job scheduling.
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    restart: unless-stopped
    volumes:
      # Photo/video library — bind mount so files survive container replacement
      - /opt/immich/photos:/usr/src/app/upload
    env_file:
      - .env
    environment:
      # Postgres connection
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      # Redis connection
      REDIS_HOSTNAME: immich_redis
    ports:
      # Bind to all interfaces so Traefik (192.168.86.20) can reach us.
      # v2.x listens on port 2283 (not 3001 as in v1.x)
      - "2283:2283"
    depends_on:
      - redis
      - database
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2283/api/server/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- Immich Machine Learning ---
  # Runs CLIP/face detection models for smart search and facial recognition.
  # CPU-only inference; ~2–4GB RAM at idle with models loaded.
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    restart: unless-stopped
    volumes:
      # Persist downloaded models (~1–3GB) across container restarts
      - /opt/immich/model-cache:/cache
    env_file:
      - .env
    healthcheck:
      # ML container does not have curl; use python3 socket check
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost', 3003)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --- Redis ---
  # Job queue for background tasks (thumbnail gen, ML jobs, etc.)
  redis:
    image: redis:6.2-alpine
    container_name: immich_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- PostgreSQL with pgvecto-rs ---
  # pgvecto-rs adds vector similarity search for ML-backed smart search.
  # Must use this specific image — stock postgres will not work.
  database:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
    volumes:
      # Postgres data directory — named volume for portability
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Postgres data — managed by Docker, survives container replacement
  pgdata:
    driver: local
