# blackbox.yml - Blackbox exporter probe modules
#
# Defines HTTP and ICMP probe types used by Prometheus scrape configs.
# Probe targets are configured in prometheus.yml, not here -- this file
# only defines the probe behavior (timeouts, expected status codes, etc.).

modules:
  # HTTP probe: expects 2xx response
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []    # Defaults to 2xx
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4

  # HTTPS probe: accepts self-signed certs (TrueNAS, etc.)
  https_insecure:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

  # HTTP probe: accepts 2xx and 3xx (for auth-gated services that redirect to Authentik)
  # Use for public *.woodhead.tech URLs behind Authentik — 302 to auth means Traefik is healthy
  http_2xx_or_3xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 301, 302, 303, 307, 308]
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4

  # ICMP probe: ping (checks host reachability and latency)
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
