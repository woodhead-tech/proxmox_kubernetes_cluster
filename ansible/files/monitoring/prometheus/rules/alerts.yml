# alerts.yml - Prometheus alert rules
#
# Alert severity tiers:
#   critical: immediate Discord notification, 1h repeat
#   warning:  Discord notification, 4h repeat
#   info:     dashboard only, no notification
#
# Alerts fire to Alertmanager, which routes them to Discord/Slack
# based on severity labels (see alertmanager/alertmanager.yml).

groups:
  # --- Service Health ---
  - name: service_health
    rules:
      # Keystone: internal container probe failed 1+ min (same-node, no cross-node noise)
      - alert: KeystoneContainerDown
        expr: probe_success{job="blackbox-http", instance="http://192.168.86.25:8083"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Keystone container down: landing page nginx not responding"
          description: "Direct probe to landing page container (192.168.86.25:8083) has been failing for 1 minute. monitoring-stack LXC or nginx container may be down."

      # Keystone: end-to-end HTTPS probe failed 2+ min (cross-node, allow retransmit settling)
      - alert: KeystoneServiceDown
        expr: probe_success{job="blackbox-https-keystone"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Keystone service down: lab.woodhead.tech not reachable"
          description: "HTTPS probe to lab.woodhead.tech has been failing for 2 minutes. Traefik routing or TLS may be broken."

      # Service HTTP probe has failed for 2+ minutes
      - alert: ServiceDown
        expr: probe_success{job=~"blackbox-http|blackbox-https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service down: {{ $labels.instance }}"
          description: "HTTP probe to {{ $labels.instance }} has been failing for over 2 minutes."

      # ICMP probe has failed for 2+ minutes (host unreachable)
      - alert: HostUnreachable
        expr: probe_success{job="blackbox-icmp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host unreachable: {{ $labels.instance }}"
          description: "ICMP probe to {{ $labels.instance }} has been failing for over 2 minutes."

      # Service responding slowly (>3s response time)
      - alert: ServiceSlowResponse
        expr: probe_duration_seconds{job=~"blackbox-http|blackbox-https"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response: {{ $labels.instance }}"
          description: "Response time from {{ $labels.instance }} has been over 3s for 5 minutes."

  # --- Host Resources (via PVE Exporter or Node Exporter) ---
  - name: host_resources
    rules:
      # CPU usage above 85% for 5 minutes
      - alert: HighCpuUsage
        expr: (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU: {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}%)"
          description: "CPU usage on {{ $labels.instance }} has been above 85% for 5 minutes."

      # Memory usage above 90% for 5 minutes
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory: {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}%)"
          description: "Memory usage on {{ $labels.instance }} has been above 90% for 5 minutes."

      # Disk space below 15% free
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space: {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}% free)"
          description: "Root filesystem on {{ $labels.instance }} has less than 15% free space."

      # Disk space below 5% free (critical)
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL disk space: {{ $labels.instance }} ({{ $value | printf \"%.1f\" }}% free)"
          description: "Root filesystem on {{ $labels.instance }} has less than 5% free space."

  # --- Docker Containers ---
  - name: container_health
    rules:
      # Container restarted more than 3 times in 10 minutes
      - alert: ContainerRestartLoop
        expr: increase(container_restart_count[10m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "Container restart loop: {{ $labels.name }}"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 10 minutes."

      # Container using >90% of its memory limit.
      # Guard denominator with `> 0` so containers WITHOUT a memory limit
      # (limit reported as 0 -> ratio +Inf, always firing) are excluded.
      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes / (container_spec_memory_limit_bytes > 0)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High container memory: {{ $labels.name }} ({{ $value | printf \"%.1f\" }}%)"

  # --- Traefik ---
  - name: traefik
    rules:
      # High 5xx error rate (>5% of requests)
      - alert: TraefikHighErrorRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traefik high error rate ({{ $value | printf \"%.1f\" }}% 5xx)"
          description: "More than 5% of Traefik requests are returning 5xx errors."

      # TLS certificate expiring within 14 days
      - alert: TlsCertExpiringSoon
        expr: (traefik_tls_certs_not_after - time()) / 86400 < 14
        labels:
          severity: warning
        annotations:
          summary: "TLS cert expiring in {{ $value | printf \"%.0f\" }} days"
          description: "A Traefik TLS certificate will expire within 14 days. Check ACME renewal."

  # --- Glucose Monitoring (Dexcom CGM) ---
  - name: glucose
    rules:
      # Glucose critically low (<55 mg/dL) -- urgent
      - alert: GlucoseCriticalLow
        expr: dexcom_glucose_mgdl < 55
        for: 0m
        labels:
          severity: critical
          channel: glucose
        annotations:
          summary: "URGENT LOW glucose: {{ $value | printf \"%.0f\" }} mg/dL"
          description: "Glucose has dropped below 55 mg/dL. Immediate attention needed."

      # Glucose low (<70 mg/dL)
      - alert: GlucoseLow
        expr: dexcom_glucose_mgdl >= 55 and dexcom_glucose_mgdl < 70
        for: 5m
        labels:
          severity: warning
          channel: glucose
        annotations:
          summary: "Low glucose: {{ $value | printf \"%.0f\" }} mg/dL"
          description: "Glucose has been below 70 mg/dL for 5 minutes."

      # Glucose high (>250 mg/dL)
      - alert: GlucoseHigh
        expr: dexcom_glucose_mgdl > 250
        for: 15m
        labels:
          severity: warning
          channel: glucose
        annotations:
          summary: "High glucose: {{ $value | printf \"%.0f\" }} mg/dL"
          description: "Glucose has been above 250 mg/dL for 15 minutes."

      # Glucose critically high (>350 mg/dL)
      - alert: GlucoseCriticalHigh
        expr: dexcom_glucose_mgdl > 350
        for: 5m
        labels:
          severity: critical
          channel: glucose
        annotations:
          summary: "URGENT HIGH glucose: {{ $value | printf \"%.0f\" }} mg/dL"
          description: "Glucose has been above 350 mg/dL for 5 minutes. Immediate attention needed."

      # Dexcom exporter hasn't reported a reading in 15 minutes
      - alert: DexcomStaleReading
        expr: time() - dexcom_reading_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          channel: glucose
        annotations:
          summary: "Dexcom reading stale ({{ $value | printf \"%.0f\" }}s old)"
          description: "No new glucose reading in over 15 minutes. Sensor may be disconnected."

  # --- Kubernetes ---
  - name: kubernetes
    rules:
      # Individual node not Ready for 5+ minutes
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "K8s node not ready: {{ $labels.node }}"
          description: "Node {{ $labels.node }} has been NotReady for over 5 minutes. Check talosctl health and VM status on Proxmox."

      # Total ready node count below expected (1 CP + 3 workers = 4)
      - alert: KubeNodeCountLow
        expr: count(kube_node_status_condition{condition="Ready",status="true"} == 1) < 4
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "K8s cluster has {{ $value | printf \"%.0f\" }}/4 nodes Ready"
          description: "Expected 4 Ready nodes (1 control-plane + 3 workers). A node may have silently dropped from the cluster."

      # Pod in CrashLoopBackOff
      - alert: KubePodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod crash looping: {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping."

      # Pod stuck in Pending for 15+ minutes
      - alert: KubePodPending
        expr: kube_pod_status_phase{phase="Pending"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod stuck pending: {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for over 15 minutes. Check for resource pressure or scheduling issues."

  # --- UPS (NUT) ---
  - name: ups
    rules:
      # UPS switched to battery power
      - alert: UpsOnBattery
        expr: network_ups_tools_ups_status{status=~".*OB.*"} == 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "UPS on battery: {{ $labels.instance }}"
          description: "{{ $labels.instance }} has switched to battery power (status: {{ $labels.status }})."

      # Battery charge below 50% (warning)
      - alert: UpsLowBatteryWarning
        expr: network_ups_tools_battery_charge < 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "UPS battery low: {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "Battery charge on {{ $labels.instance }} has been below 50% for 1 minute."

      # Battery charge below 20% (critical)
      - alert: UpsLowBatteryCritical
        expr: network_ups_tools_battery_charge < 20
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "UPS battery critical: {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "Battery charge on {{ $labels.instance }} is below 20%. Imminent shutdown risk."

      # UPS load above 80% for 5 minutes (warning)
      - alert: UpsHighLoadWarning
        expr: network_ups_tools_ups_load > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UPS high load: {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "UPS load on {{ $labels.instance }} has been above 80% for 5 minutes."

      # UPS load above 90% for 5 minutes (critical)
      - alert: UpsHighLoadCritical
        expr: network_ups_tools_ups_load > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "UPS overloaded: {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}%)"
          description: "UPS load on {{ $labels.instance }} has been above 90% for 5 minutes."

      # Runtime remaining below 10 minutes
      - alert: UpsLowRuntime
        expr: network_ups_tools_battery_runtime < 600
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "UPS low runtime: {{ $labels.instance }} ({{ $value | printf \"%.0f\" }}s)"
          description: "{{ $labels.instance }} has less than 10 minutes of battery runtime remaining."

  # --- Prometheus Self-Monitoring ---
  - name: prometheus
    rules:
      # Prometheus scrape target is down
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target down: {{ $labels.job }} / {{ $labels.instance }}"
          description: "Prometheus cannot reach {{ $labels.instance }} (job: {{ $labels.job }}) for 5 minutes."

      # Alertmanager unreachable
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager is down"
          description: "Prometheus cannot reach Alertmanager. Alerts will not be delivered."
