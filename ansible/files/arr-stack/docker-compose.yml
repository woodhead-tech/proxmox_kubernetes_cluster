# docker-compose.yml - ARR media management stack
#
# All services share the same Docker network and communicate via
# container names (e.g., sonarr can reach prowlarr at http://prowlarr:9696).
#
# Media storage is mounted from the host at /media via NFS from TrueNAS
# (bind-mounted into the LXC by the Proxmox host via pct set -mp0).
#
# Data persistence: Each service stores its config in /opt/arr/<service>/config.
# These survive container rebuilds. Back up /opt/arr/ to preserve settings.
#
# After starting, configure each service via its web UI:
#   Prowlarr:  http://<ip>:9696  (set up indexers first)
#   Sonarr:    http://<ip>:8989  (connect to Prowlarr + SABnzbd)
#   Radarr:    http://<ip>:7878  (connect to Prowlarr + SABnzbd)
#   Bazarr:    http://<ip>:6767  (connect to Sonarr + Radarr)
#   Overseerr: http://<ip>:5055  (connect to Sonarr + Radarr)
#   SABnzbd:      http://<ip>:8080  (set up Usenet server)
#   qBittorrent:  http://<ip>:8090  (torrent client, routed through gluetun VPN)
#   FlareSolverr: http://<ip>:8191  (Cloudflare bypass proxy for Prowlarr)

services:

  # --- Prowlarr: Indexer Manager ---
  # Central indexer management. Sonarr/Radarr pull indexer configs from here.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/arr/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  # --- Sonarr: TV Show Management ---
  # Monitors RSS feeds, searches indexers, manages TV library.
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/arr/sonarr/config:/config
      - /media:/media          # NFS mount from TrueNAS
      - /media/downloads:/downloads  # Same path as SABnzbd for hardlink imports
    ports:
      - "8989:8989"
    restart: unless-stopped

  # --- Radarr: Movie Management ---
  # Same as Sonarr but for movies.
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/arr/radarr/config:/config
      - /media:/media
      - /media/downloads:/downloads  # Same path as SABnzbd for hardlink imports
    ports:
      - "7878:7878"
    restart: unless-stopped

  # --- Bazarr: Subtitle Management ---
  # Automatically downloads subtitles for Sonarr/Radarr media.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/arr/bazarr/config:/config
      - /media:/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  # --- Seerr: Request Management ---
  # Successor to Overseerr/Jellyseerr. Supports Plex, Jellyfin, and Emby.
  # User-facing portal for requesting movies/TV shows.
  # Integrates with Sonarr/Radarr to automatically fulfill requests.
  overseerr:
    image: seerr/seerr:latest
    container_name: overseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/arr/overseerr/config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  # --- Gluetun: VPN killswitch for SABnzbd ---
  # SABnzbd runs inside gluetun's network namespace. All SABnzbd download
  # traffic exits through PrivadoVPN. If the VPN drops, SABnzbd loses
  # connectivity entirely (built-in killswitch).
  # WireGuard private key stored in /opt/arr/gluetun/wireguard_private_key (never committed).
  # SECRETFILE var reads from mounted file, keeping the key out of git.
  # Public key, addresses, and endpoint are non-secret server config.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY_SECRETFILE=/run/secrets/wireguard_private_key
      - WIREGUARD_PUBLIC_KEY=KgTUh3KLijVluDvNpzDCJJfrJ7EyLzYLmdHCksG4sRg=
      - WIREGUARD_ADDRESSES=100.64.8.241/32
      - WIREGUARD_ENDPOINT_IP=45.38.15.158
      - WIREGUARD_ENDPOINT_PORT=51820
      - TZ=America/Chicago
      - FIREWALL_INPUT_PORTS=8080,8090
    volumes:
      - /opt/arr/gluetun/wireguard_private_key:/run/secrets/wireguard_private_key:ro
    ports:
      - "8080:8080"  # SABnzbd port exposed through gluetun's network
      - "8090:8090"  # qBittorrent web UI exposed through gluetun's network
    restart: unless-stopped

  # --- SABnzbd: Usenet Downloader ---
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/arr/sabnzbd/config:/config
      - /media/downloads:/downloads
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped

  # --- qBittorrent: Torrent Downloader ---
  # Routes all torrent traffic through gluetun VPN (same killswitch as SABnzbd).
  # Web UI on port 8090. Default credentials: admin/adminadmin (change on first login).
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8090
    volumes:
      - /opt/arr/qbittorrent/config:/config
      - /media/downloads:/downloads
    restart: unless-stopped

  # --- FlareSolverr: Cloudflare bypass proxy ---
  # Used by Prowlarr to access indexers protected by Cloudflare DDoS challenges.
  # Prowlarr proxies requests through this service via its settings.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Chicago
    ports:
      - "8191:8191"
    restart: unless-stopped

  # --- Whisparr: Adult Movie Management ---
  # Collection manager for adult movies, fork of Radarr/Sonarr.
  whisparr:
    image: ghcr.io/hotio/whisparr:latest
    container_name: whisparr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /opt/arr/whisparr/config:/config
      - /media:/media
      - /media/downloads:/downloads  # Same path as SABnzbd for hardlinks
    ports:
      - "6969:6969"
    restart: unless-stopped
