# Vaultwarden — self-hosted Bitwarden-compatible password manager
#
# Credentials sourced from /opt/vaultwarden/.env (generated by Ansible, never
# committed to git). Re-run `make vaultwarden` to reconfigure; data persists in
# /opt/vaultwarden/data across re-runs.
#
# Ports exposed:
#   80  - HTTP (Traefik terminates TLS; vault.woodhead.tech → this port)
#
# Admin panel: vault.woodhead.tech/admin (Authentik-protected at the Traefik layer)
# Web vault:   vault.woodhead.tech       (Vaultwarden's own login)

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file: /opt/vaultwarden/.env
    volumes:
      - /opt/vaultwarden/data:/data
    ports:
      - "80:80"
    environment:
      ROCKET_PORT: "80"
