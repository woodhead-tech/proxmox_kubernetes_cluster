# UniFi Network Application + MongoDB
#
# Passwords are sourced from /opt/unifi/.env (generated by Ansible on first deploy,
# never checked into git). Re-run `make unifi` to reconfigure; passwords persist
# across runs as long as /opt/unifi/.env exists.
#
# Ports:
#   8443  - HTTPS web UI (Traefik routes unifi.woodhead.tech here)
#   8080  - AP inform port (APs call home here; NOT proxied through Traefik)
#   3478  - STUN (used by UniFi for NAT traversal info)
#   10001 - L2 AP discovery (UDP broadcast; only works on same L2 segment)

services:
  unifi-db:
    image: mongo:7
    container_name: unifi-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    volumes:
      - /opt/unifi/db:/data/db
      - /opt/unifi/db-init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-network-application
    restart: unless-stopped
    depends_on:
      - unifi-db
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
      MONGO_USER: unifi
      MONGO_PASS: ${MONGO_UNIFI_PASS}
      MONGO_HOST: unifi-db
      MONGO_PORT: 27017
      MONGO_DBNAME: unifi
      MEM_LIMIT: 1024
      MEM_STARTUP: 512
    volumes:
      - /opt/unifi/data:/config
    ports:
      - "8443:8443"
      - "8080:8080"
      - "3478:3478/udp"
      - "10001:10001/udp"
