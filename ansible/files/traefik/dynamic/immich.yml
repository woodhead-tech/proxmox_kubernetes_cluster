# immich.yml - Immich photo/video library route
#
# Routes immich.woodhead.tech to the Immich LXC at 192.168.86.55:2283.
# Protected by Authentik forward-auth middleware — SSO login required.
#
# photos.woodhead.tech is reserved for the graduation photos app (192.168.86.45).

http:
  routers:
    immich:
      rule: "Host(`immich.woodhead.tech`)"
      entryPoints:
        - websecure
      service: immich
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

  services:
    immich:
      loadBalancer:
        servers:
          - url: "http://192.168.86.55:2283"
