# unifi.yml - UniFi Network Application route
#
# Routes unifi.woodhead.tech to the UniFi web UI (HTTPS/8443).
# UniFi uses a self-signed cert internally, so insecureSkipVerify is required.
#
# NOTE: The AP inform port (8080) and STUN (3478/udp) are NOT routed through
# Traefik. APs communicate directly to 192.168.86.43:8080 on the LAN.
# When adopting APs, set the inform URL in UniFi to: http://192.168.86.43:8080

http:
  routers:
    unifi:
      rule: "Host(`unifi.woodhead.tech`)"
      entryPoints:
        - websecure
      service: unifi
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

  services:
    unifi:
      loadBalancer:
        servers:
          - url: "https://192.168.86.43:8443"
        serversTransport: unifi-transport

  serversTransports:
    unifi-transport:
      insecureSkipVerify: true
