# skypups.yml - Sky Pups Treats consulting demo redirect
#
# Engagement complete. Redirects skypups.woodhead.tech to the main consulting
# site. CloudFront distribution (d2vzjqueq92j16.cloudfront.net) can be
# deactivated in AWS console — it no longer receives any traffic.
http:
  middlewares:
    skypups-to-consulting:
      redirectRegex:
        regex: ".*"
        replacement: "https://woodhead.tech"
        permanent: true

  routers:
    skypups:
      rule: "Host(`skypups.woodhead.tech`)"
      entryPoints:
        - websecure
      service: skypups-noop
      middlewares:
        - skypups-to-consulting
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"

  services:
    # Redirect fires before the service is reached; this is a required placeholder.
    skypups-noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"
