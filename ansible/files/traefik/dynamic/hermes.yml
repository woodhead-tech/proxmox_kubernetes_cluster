# hermes.yml - Hermes AI Agent dashboard route
#
# Routes hermes.woodhead.tech to the Hermes LXC.
# Protected by Authentik.

http:
  routers:
    hermes:
      rule: "Host(`hermes.woodhead.tech`)"
      entryPoints:
        - websecure
      service: hermes
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

  services:
    hermes:
      loadBalancer:
        servers:
          - url: "http://192.168.86.52:9119"
