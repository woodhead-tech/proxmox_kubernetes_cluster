# media-stack.yml - Traefik routes for media services
#
# Routes for Plex and Jellyfin web UIs.
# TrueNAS route is in truenas.yml (requires passHostHeader: false).

http:
  routers:
    # Plex web UI -- no Authelia (Plex has its own auth system)
    plex:
      rule: "Host(`plex.woodhead.tech`)"
      entryPoints:
        - websecure
      service: plex
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"

    # Jellyfin web UI -- no Authelia (Jellyfin has built-in auth)
    jellyfin:
      rule: "Host(`jellyfin.woodhead.tech`)"
      entryPoints:
        - websecure
      service: jellyfin
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"

  services:
    plex:
      loadBalancer:
        servers:
          - url: "http://192.168.86.23:32400"

    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.86.24:8096"
