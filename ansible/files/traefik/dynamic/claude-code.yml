http:
  routers:
    claude-code:
      rule: "Host(`claude.woodhead.tech`)"
      entryPoints:
        - websecure
      service: claude-code
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

  services:
    claude-code:
      loadBalancer:
        servers:
          - url: "http://192.168.86.48:7681"
