# step-ca.yml - Traefik route for Smallstep step-ca API
#
# Restricted to LAN + WireGuard VPN only via lan-only@file middleware.
# All users (Brandon) connect via WireGuard when remote, so LAN restriction is safe.
# If external SSH cert issuance is ever needed without VPN, remove lan-only@file.

http:
  routers:
    step-ca:
      rule: "Host(`step-ca.woodhead.tech`)"
      entryPoints:
        - websecure
      service: step-ca
      middlewares:
        - lan-only@file
      tls:
        certResolver: cloudflare

  services:
    step-ca:
      loadBalancer:
        servers:
          - url: "https://192.168.86.36:9000"
        # Since step-ca uses its own internal self-signed or CA-signed cert,
        # we need to tell Traefik to trust it or skip validation.
        # For simplicity in this homelab, we skip validation for the backend.
        serversTransport: step-ca-transport

  serversTransports:
    step-ca-transport:
      insecureSkipVerify: true
