# pwnagotchi.yml - Traefik route for pwnagotchi web UI
#
# LXC 216, IP 192.168.86.38, port 8080
# Restricted to LAN + WireGuard VPN only via lan-only@file middleware.
# The pwnagotchi UI has no authentication — public exposure would leak WiFi capture data.

http:
  routers:
    pwnagotchi:
      rule: "Host(`pwnagotchi.woodhead.tech`)"
      entryPoints:
        - websecure
      service: pwnagotchi
      middlewares:
        - lan-only@file
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"

  services:
    pwnagotchi:
      loadBalancer:
        servers:
          - url: "http://192.168.86.38:8080"
