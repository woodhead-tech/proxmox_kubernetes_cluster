# arr-stack.yml - Traefik routes for the ARR media management stack
#
# Routes for Sonarr, Radarr, Prowlarr, Bazarr, Overseerr, and SABnzbd.
# All services run in a single LXC (VM ID 202, IP 192.168.86.22) via Docker Compose.

http:
  routers:
    overseerr:
      rule: "Host(`requests.woodhead.tech`) || Host(`request.woodhead.tech`)"
      entryPoints:
        - websecure
      service: overseerr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    prowlarr:
      rule: "Host(`prowlarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: prowlarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    sonarr:
      rule: "Host(`sonarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: sonarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    radarr:
      rule: "Host(`radarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: radarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    bazarr:
      rule: "Host(`bazarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: bazarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    sabnzbd:
      rule: "Host(`sabnzbd.woodhead.tech`)"
      entryPoints:
        - websecure
      service: sabnzbd
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    whisparr:
      rule: "Host(`whisparr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: whisparr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    qbittorrent:
      rule: "Host(`qbittorrent.woodhead.tech`)"
      entryPoints:
        - websecure
      service: qbittorrent
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    flaresolverr:
      rule: "Host(`flaresolverr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: flaresolverr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

  services:
    overseerr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:5055"

    prowlarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:9696"

    sonarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8989"

    radarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:7878"

    bazarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:6767"

    sabnzbd:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8080"

    whisparr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:6969"

    qbittorrent:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8090"

    flaresolverr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8191"
