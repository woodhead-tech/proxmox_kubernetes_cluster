# arr-stack.yml - Traefik routes for the ARR media management stack
#
# Routes for Sonarr, Radarr, Prowlarr, Bazarr, Overseerr, SABnzbd, LazyLibrarian and Calibre-Web.
# All services run in a single LXC (VM ID 202, IP 192.168.86.22) via Docker Compose.

http:
  routers:
    overseerr:
      rule: "Host(`requests.woodhead.tech`) || Host(`request.woodhead.tech`)"
      entryPoints:
        - websecure
      service: overseerr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    prowlarr:
      rule: "Host(`prowlarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: prowlarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    sonarr:
      rule: "Host(`sonarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: sonarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    radarr:
      rule: "Host(`radarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: radarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    bazarr:
      rule: "Host(`bazarr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: bazarr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    sabnzbd:
      rule: "Host(`sabnzbd.woodhead.tech`)"
      entryPoints:
        - websecure
      service: sabnzbd
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    whisparr:
      rule: "Host(`whisparr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: whisparr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    qbittorrent:
      rule: "Host(`qbittorrent.woodhead.tech`)"
      entryPoints:
        - websecure
      service: qbittorrent
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    flaresolverr:
      rule: "Host(`flaresolverr.woodhead.tech`)"
      entryPoints:
        - websecure
      service: flaresolverr
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    lazylibrarian:
      rule: "Host(`lazylibrarian.woodhead.tech`)"
      entryPoints:
        - websecure
      service: lazylibrarian
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    # Calibre-Web UI: behind Authentik SSO like the other arr UIs.
    calibre-web:
      rule: "Host(`books.woodhead.tech`)"
      entryPoints:
        - websecure
      service: calibre-web
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"
      middlewares:
        - authentik@file

    # OPDS feed bypasses Authentik: e-reader apps can't do an SSO redirect, so they
    # authenticate with Calibre-Web's own HTTP basic auth instead. Higher priority wins.
    calibre-web-opds:
      rule: "Host(`books.woodhead.tech`) && PathPrefix(`/opds`)"
      priority: 100
      entryPoints:
        - websecure
      service: calibre-web
      tls:
        certResolver: cloudflare
        domains:
          - main: "*.woodhead.tech"

  services:
    overseerr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:5055"

    prowlarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:9696"

    sonarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8989"

    radarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:7878"

    bazarr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:6767"

    sabnzbd:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8080"

    whisparr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:6969"

    qbittorrent:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8090"

    flaresolverr:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8191"

    lazylibrarian:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:5299"

    calibre-web:
      loadBalancer:
        servers:
          - url: "http://192.168.86.22:8083"
