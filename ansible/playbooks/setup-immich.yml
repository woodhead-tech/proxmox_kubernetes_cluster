# setup-immich.yml - Deploy Immich self-hosted photo/video library
#
# This playbook configures the immich LXC container:
#   1. Installs Docker CE and Docker Compose plugin
#   2. Creates /opt/immich/ directory structure including /opt/immich/photos
#   3. Generates DB_PASSWORD and JWT_SECRET if .env does not exist
#   4. Templates docker-compose.yml to /opt/immich/
#   5. Starts the full Immich stack (server + ML + redis + postgres)
#   6. Health-checks the server ping endpoint
#   7. Prints the access URL
#
# Prerequisites:
#   - immich LXC created via Terraform (make apply or terraform apply -target=...)
#   - SSH access to the LXC at 192.168.86.55
#   - Internet access for Docker image pulls (~4–6GB total: server, ML, postgres)
#   - At least 6GB RAM free on tower1
#
# Usage:
#   make immich
#   # or directly:
#   cd ansible && ansible-playbook playbooks/setup-immich.yml
---
- name: Deploy Immich photo/video library
  hosts: immich
  vars:
    # Application directory on the LXC
    app_dir: /opt/immich
    # Immich image tag — "release" tracks latest stable
    immich_version: "release"
    compose_src: "{{ playbook_dir }}/../files/immich/docker-compose.yml"

  tasks:
    # --- SSH Socket Activation Fix ---
    # Debian 12 uses socket activation for SSH; disable so sshd binds IPv4 directly.
    - name: Disable SSH socket activation
      ansible.builtin.systemd:
        name: ssh.socket
        enabled: false
        state: stopped
      failed_when: false

    - name: Ensure SSH listens on IPv4
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?ListenAddress "
        line: "ListenAddress 0.0.0.0"
        create: false

    # --- System Setup ---
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - wget
        state: present

    # --- Docker Installation ---
    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set permissions on Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.copy:
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"

    - name: Install Docker CE and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # --- Directory Structure ---
    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create photos library directory
      # Bind-mounted into immich-server at /usr/src/app/upload
      # Store all photo/video originals here; survives container replacement.
      ansible.builtin.file:
        path: "{{ app_dir }}/photos"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create ML model cache directory
      # Persists downloaded CLIP + face detection models (~1–3GB).
      # Avoids re-downloading on every container restart.
      ansible.builtin.file:
        path: "{{ app_dir }}/model-cache"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # --- Secrets Generation ---
    - name: Check if .env already exists
      # Idempotent: never overwrite existing credentials.
      ansible.builtin.stat:
        path: "{{ app_dir }}/.env"
      register: env_stat

    - name: Generate DB_PASSWORD
      # 32 random bytes base64-encoded — only runs if .env is absent.
      ansible.builtin.command:
        cmd: openssl rand -base64 32
      register: db_password_gen
      changed_when: false
      when: not env_stat.stat.exists

    - name: Generate JWT_SECRET
      # Separate secret for JWT token signing.
      ansible.builtin.command:
        cmd: openssl rand -base64 32
      register: jwt_secret_gen
      changed_when: false
      when: not env_stat.stat.exists

    - name: Write .env file with generated secrets
      # Mode 0600: credentials readable by root only.
      ansible.builtin.copy:
        content: |
          # Immich environment variables
          # Generated by setup-immich.yml — do not edit DB_PASSWORD or JWT_SECRET manually.
          IMMICH_VERSION={{ immich_version }}
          DB_PASSWORD={{ db_password_gen.stdout }}
          JWT_SECRET={{ jwt_secret_gen.stdout }}
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      when: not env_stat.stat.exists

    # --- Deploy ---
    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: "{{ compose_src }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart stack

    - name: Start stack
      # Pull images + start all containers in detached mode.
      # First run downloads ~4–6GB; can take 5–10 minutes on a slow link.
      ansible.builtin.command:
        cmd: docker compose up -d --pull always
        chdir: "{{ app_dir }}"
      changed_when: true

    # --- Verify ---
    - name: Wait for Immich server to initialize
      # Postgres needs time to initialize schema on first boot.
      ansible.builtin.pause:
        seconds: 30

    - name: Check Immich server ping endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:2283/api/server-info/ping"
        return_content: false
        status_code: 200
      register: ping_check
      retries: 10
      delay: 10
      until: ping_check.status == 200

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "Immich deployed to {{ app_dir }}"
          - "Photos library: {{ app_dir }}/photos"
          - "ML model cache: {{ app_dir }}/model-cache"
          - "Internal URL: http://{{ ansible_host }}:2283"
          - "External URL: https://photos.woodhead.tech (after Traefik route is live)"
          - "FIRST BOOT: Create admin account at https://photos.woodhead.tech"

  handlers:
    - name: Restart stack
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate
        chdir: "{{ app_dir }}"
