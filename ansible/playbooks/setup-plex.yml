# setup-plex.yml - Install Plex Media Server in its LXC
#
# This playbook:
#   1. Mounts TrueNAS NFS at /mnt/truenas-media on the Proxmox host (pve2)
#      and wires it into the LXC as /media via pct bind mount (mp0)
#   2. Configures iGPU passthrough on the Proxmox host (for hardware transcoding)
#   3. Installs Plex Media Server from the official repository
#
# Prerequisites:
#   - Plex LXC (VMID 203) created via Terraform (make apply-lxc), runs on pve2 (thinkcentre2)
#   - SSH access to both Proxmox host and LXC
#   - TrueNAS NFS export at 192.168.86.40:/mnt/tank/media accessible on LAN
#
# Usage:
#   ansible-playbook playbooks/setup-plex.yml
#
# Without GPU passthrough:
#   ansible-playbook playbooks/setup-plex.yml --extra-vars "gpu_passthrough=false"
#
# MANUAL STEPS REQUIRED AFTER DEPLOY (cannot be automated):
#   1. Open http://192.168.86.23:32400/web from a LAN browser
#   2. Sign in with your plex.tv account to CLAIM the server
#      (required for TV apps and remote clients to connect)
#   3. Add libraries: Movies -> /media/movies, TV Shows -> /media/tv
#   4. Enable hardware transcoding in Settings > Transcoder (requires Plex Pass)
---
# --- Play 1: Configure Proxmox host (NFS mount + bind mount + GPU passthrough) ---
- name: Configure Proxmox host for Plex LXC
  hosts: pve2
  vars:
    plex_vmid: 203
    gpu_passthrough: true
    nfs_server: "192.168.86.40"
    nfs_share: "/mnt/tank/media"
    host_mount: "/mnt/truenas-media"

  tasks:
    # --- NFS host mount ---
    - name: Create NFS mount point on Proxmox host
      ansible.builtin.file:
        path: "{{ host_mount }}"
        state: directory
        mode: "0755"

    - name: Add NFS mount to fstab (systemd automount)
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ nfs_server }}:{{ nfs_share }} {{ host_mount }} nfs soft,intr,_netdev,x-systemd.automount,x-systemd.mount-timeout=30 0 0"
        state: present

    - name: Reload systemd and mount NFS
      ansible.builtin.shell:
        cmd: systemctl daemon-reload && (mountpoint -q {{ host_mount }} || mount {{ host_mount }})
      changed_when: true

    - name: Verify NFS media is accessible
      ansible.builtin.command:
        cmd: "timeout 5 ls {{ host_mount }}"
      register: nfs_contents
      changed_when: false

    - name: Show NFS contents
      ansible.builtin.debug:
        msg: "TrueNAS media directories: {{ nfs_contents.stdout_lines }}"

    # --- Wire NFS into LXC via pct bind mount ---
    - name: Stop Plex LXC to apply bind mount
      ansible.builtin.command:
        cmd: pct stop {{ plex_vmid }}
      register: pct_stop
      changed_when: pct_stop.rc == 0
      failed_when: false

    - name: Add media bind mount to LXC config
      ansible.builtin.command:
        cmd: pct set {{ plex_vmid }} -mp0 {{ host_mount }},mp=/media
      register: pct_set
      changed_when: pct_set.rc == 0

    # --- GPU Passthrough ---
    - name: Check if /dev/dri exists on Proxmox host
      ansible.builtin.stat:
        path: /dev/dri
      register: dri_device
      when: gpu_passthrough | bool

    - name: Add GPU passthrough to LXC config
      ansible.builtin.blockinfile:
        path: "/etc/pve/lxc/{{ plex_vmid }}.conf"
        marker: "# {mark} GPU PASSTHROUGH - MANAGED BY ANSIBLE"
        block: |
          lxc.cgroup2.devices.allow: c 226:* rwm
          lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
      when: gpu_passthrough | bool and dri_device.stat.exists

    - name: Note about GPU
      ansible.builtin.debug:
        msg: >
          GPU passthrough skipped. Either gpu_passthrough=false or /dev/dri
          not found on this node. Plex will use software transcoding (CPU).
      when: not (gpu_passthrough | bool) or not dri_device.stat.exists

    - name: Start Plex LXC
      ansible.builtin.command:
        cmd: pct start {{ plex_vmid }}
      register: pct_start
      changed_when: pct_start.rc == 0

    - name: Wait for LXC to boot
      ansible.builtin.pause:
        seconds: 5

# --- Play 2: Install Plex inside the LXC ---
- name: Install Plex Media Server
  hosts: lxc_services:&plex
  vars:
    media_mount: /media

  tasks:
    # --- System Setup ---
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - nfs-common
        state: present

    # --- Plex Installation ---
    - name: Add Plex GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://downloads.plex.tv/plex-keys/PlexSign.key | gpg --dearmor -o /etc/apt/keyrings/plex.gpg
        creates: /etc/apt/keyrings/plex.gpg

    - name: Set permissions on Plex GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/plex.gpg
        mode: "0644"

    - name: Add Plex repository
      ansible.builtin.copy:
        content: |
          deb [signed-by=/etc/apt/keyrings/plex.gpg] https://downloads.plex.tv/repo/deb public main
        dest: /etc/apt/sources.list.d/plexmediaserver.list
        mode: "0644"

    - name: Install Plex Media Server
      ansible.builtin.apt:
        name: plexmediaserver
        state: present
        update_cache: true

    - name: Enable and start Plex
      ansible.builtin.systemd:
        name: plexmediaserver
        enabled: true
        state: started

    # --- Verify media mount ---
    - name: Verify media is accessible inside LXC
      ansible.builtin.command:
        cmd: "timeout 5 ls {{ media_mount }}"
      register: media_contents
      changed_when: false
      failed_when: media_contents.rc != 0

    - name: Show media directories
      ansible.builtin.debug:
        msg: "Media at {{ media_mount }}: {{ media_contents.stdout_lines }}"

    # --- Verify GPU access ---
    - name: Check for GPU device inside container
      ansible.builtin.stat:
        path: /dev/dri/renderD128
      register: gpu_device

    - name: GPU status
      ansible.builtin.debug:
        msg: "{{ 'iGPU detected at /dev/dri/renderD128 -- hardware transcoding available' if gpu_device.stat.exists else 'No GPU detected -- using software transcoding (CPU)' }}"

    # --- Verify ---
    - name: Wait for Plex to start
      ansible.builtin.pause:
        seconds: 10

    - name: Check Plex is running
      ansible.builtin.command:
        cmd: systemctl is-active plexmediaserver
      register: plex_status
      changed_when: false

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "Plex Media Server deployed"
          - "Service status: {{ plex_status.stdout }}"
          - "Web UI: http://{{ ansible_host }}:32400/web"
          - "Media: {{ media_contents.stdout_lines }}"
          - "GPU: {{ 'available' if gpu_device.stat.exists else 'not detected' }}"
          - ""
          - "MANUAL STEPS REQUIRED:"
          - "  1. Open http://{{ ansible_host }}:32400/web from a LAN browser"
          - "  2. Sign in with your plex.tv account to CLAIM the server"
          - "     (TV apps and remote clients won't connect until this is done)"
          - "  3. Add libraries: Movies -> /media/movies, TV Shows -> /media/tv"
          - "  4. Enable hardware transcoding in Settings > Transcoder (Plex Pass)"
