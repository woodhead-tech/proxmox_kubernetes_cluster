# setup-guacamole.yml - Deploy Apache Guacamole browser-based remote desktop gateway
#
# Deploys guacamole + guacd + postgres via Docker Compose on the guacamole LXC.
# Generates the Guacamole PostgreSQL schema on first run.
#
# Prerequisites:
#   - guacamole LXC created via Terraform (make apply-lxc)
#   - SSH access to 192.168.86.47
#
# Usage:
#   make guacamole GUAC_POSTGRES_PASSWORD=<password>
#
# Post-deploy:
#   - Browse to https://guac.woodhead.tech (after Traefik route is live)
#   - Default login: guacadmin / guacadmin — CHANGE IMMEDIATELY
#   - Add connections via Settings > Connections > New Connection
#   - Dev desktop: RDP to 192.168.86.48:3389, username bwoodwar
---
- name: Deploy Apache Guacamole
  hosts: guacamole
  vars:
    app_dir: /opt/guacamole
    guac_image: guacamole/guacamole:1.5.5
    guac_postgres_password: "{{ guac_postgres_password | mandatory }}"
    compose_src: "{{ playbook_dir }}/../files/guacamole/docker-compose.yml"

  tasks:
    - name: Disable SSH socket activation
      ansible.builtin.systemd:
        name: ssh.socket
        enabled: false
        state: stopped
      failed_when: false

    - name: Ensure SSH listens on IPv4
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?ListenAddress "
        line: "ListenAddress 0.0.0.0"
        create: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set permissions on Docker GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.copy:
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"

    - name: Install Docker CE and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create app directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/initdb"

    - name: Generate Guacamole PostgreSQL schema
      ansible.builtin.shell:
        cmd: >
          docker run --rm {{ guac_image }}
          /opt/guacamole/bin/initdb.sh --postgresql
          > {{ app_dir }}/initdb/001-initdb.sql
        creates: "{{ app_dir }}/initdb/001-initdb.sql"

    - name: Write .env file
      ansible.builtin.copy:
        content: |
          POSTGRES_PASSWORD={{ guac_postgres_password }}
          POSTGRESQL_PASSWORD={{ guac_postgres_password }}
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: "{{ compose_src }}"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"
      notify: Restart stack

    - name: Start stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Wait for Guacamole to start
      ansible.builtin.pause:
        seconds: 30

    - name: Check Guacamole health
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/guacamole/"
        return_content: false
        status_code: 200
      register: health_check
      retries: 10
      delay: 5
      until: health_check.status == 200

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "Guacamole deployed to {{ app_dir }}"
          - "Internal URL: http://{{ ansible_host }}:8080/guacamole/"
          - "External URL: https://guac.woodhead.tech (after Traefik route is live)"
          - "Default login: guacadmin / guacadmin — CHANGE IMMEDIATELY"
          - "Add dev desktop: Settings > Connections > New Connection"
          - "  Protocol: RDP, Hostname: 192.168.86.48, Port: 3389"
          - "  Username: bwoodwar, use the password set during dev-desktop deploy"

  handlers:
    - name: Restart stack
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate
        chdir: "{{ app_dir }}"
