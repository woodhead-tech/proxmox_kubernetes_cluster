      changed_when: "'Pull complete' in pull_result.stderr or 'Downloaded' in pull_result.stderr"

    - name: Recreate Mailcow containers with new images
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: /opt/mailcow-dockerized
      when: pull_result.changed

    - name: Verify Mailcow SMTP port is listening
      ansible.builtin.wait_for:
        port: 25
        host: 127.0.0.1
        timeout: 30
      when: pull_result.changed

    - name: Clean up old Docker images
      ansible.builtin.command:
        cmd: docker image prune -f
      changed_when: false

