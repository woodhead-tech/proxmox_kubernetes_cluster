# patch-docker.yml - Update Docker Compose stacks
#
# Pulls latest images and recreates containers for all Docker-based LXC services.
# Each service is a separate play so --limit targets specific hosts cleanly.
#
# Usage:
#   cd ansible && ansible-playbook playbooks/patch-docker.yml          # all
#   cd ansible && ansible-playbook playbooks/patch-docker.yml --limit arr-stack
#   cd ansible && ansible-playbook playbooks/patch-docker.yml --limit authentik,wireguard
#
# Staggered daily maintenance targets (see Makefile):
#   make patch-docker-monday     # security:     authentik
#   make patch-docker-tuesday    # media:        arr-stack, jellyfin-server
#   make patch-docker-wednesday  # apps:         drawio, immich, kanboard
#   make patch-docker-thursday   # infra:        mailserver, vaultwarden
#   make patch-docker-friday     # observability: monitoring-stack

---
# ===== Monday: Security =====

- name: Update Authentik Docker images
  hosts: authentik
  become: true
  gather_facts: false

  tasks:
    - name: Pull latest Authentik images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /opt/authentik
      register: pull_result
      changed_when: "'Pull complete' in pull_result.stderr or 'Downloaded' in pull_result.stderr"

    - name: Recreate Authentik containers with new images
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: /opt/authentik
      when: pull_result.changed

    - name: Verify Authentik health
      ansible.builtin.uri:
        url: "http://127.0.0.1:9000/-/health/live/"
        status_code: 200
      retries: 5
      delay: 5
      when: pull_result.changed

    - name: Clean up old Docker images
      ansible.builtin.command:
        cmd: docker image prune -f
      changed_when: false

