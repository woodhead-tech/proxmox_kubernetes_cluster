<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>woodhead.tech - Dashboard</title>
    <meta name="description" content="Homelab operations dashboard">
    <link rel="icon" href="/favicon.png" type="image/png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        a { color: inherit; text-decoration: none; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #161b22;
            border-bottom: 1px solid #21262d;
            height: 48px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .topbar h1 {
            font-size: 1em;
            font-weight: 600;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85em;
            color: #8b949e;
        }

        .topbar-right a {
            color: #3fb950;
            font-size: 0.85em;
        }

        #clock {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            color: #e6edf3;
        }

        .refresh-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            height: calc(100vh - 48px);
        }

        .panel {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid #21262d;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .services-panel { grid-row: 1 / 3; }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }

        .svc {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 8px;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }

        .svc:hover {
            border-color: #30363d;
            background: #1c2333;
        }

        .svc-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .svc-dot.up { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
        .svc-dot.down { background: #f85149; box-shadow: 0 0 6px #f8514966; }
        .svc-dot.unknown { background: #484f58; }
        .svc-dot.paused { background: #30363d; }

        .svc.paused {
            opacity: 0.4;
            cursor: default;
            pointer-events: none;
        }

        .svc-info { min-width: 0; }

        .svc-name {
            font-size: 0.85em;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .svc-sub {
            font-size: 0.7em;
            color: #484f58;
        }

        .svc-group-header {
            grid-column: 1 / -1;
            font-size: 0.68em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #484f58;
            padding: 10px 4px 4px;
            border-bottom: 1px solid #21262d;
            margin-top: 2px;
        }

        .svc-group-header:first-child { margin-top: 0; padding-top: 2px; }

        .svc-group-header.demos {
            color: #d29922;
            border-bottom-color: #d2992233;
        }

        .view-tabs {
            display: flex;
            gap: 4px;
        }

        .view-tab {
            font-size: 0.75em;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: transparent;
            color: #8b949e;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .view-tab.active {
            background: #21262d;
            color: #e6edf3;
            border-color: #484f58;
        }

        .routes-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78em;
        }

        .routes-table th {
            text-align: left;
            padding: 6px 8px;
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #21262d;
            white-space: nowrap;
        }

        .routes-table td {
            padding: 5px 8px;
            border-bottom: 1px solid #161b22;
            vertical-align: middle;
        }

        .routes-table tr:hover td { background: #1c2333; }

        .routes-table td:first-child { font-family: monospace; color: #79c0ff; }

        .routes-table td:nth-child(2) { font-family: monospace; color: #8b949e; }

        .auth-badge {
            display: inline-block;
            font-size: 0.85em;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .auth-badge.sso { background: #3fb95022; color: #3fb950; }
        .auth-badge.own { background: #79c0ff22; color: #79c0ff; }
        .auth-badge.none { background: #21262d; color: #484f58; }

        .route-group-row td {
            padding-top: 12px;
            padding-bottom: 4px;
            font-size: 0.68em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #484f58;
            border-bottom: 1px solid #21262d;
        }

        .metric-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px;
        }

        .metric-row + .metric-row { border-top: 1px solid #21262d; }

        .metric-label {
            font-size: 0.8em;
            color: #8b949e;
            width: 90px;
            flex-shrink: 0;
        }

        .metric-bar {
            flex: 1;
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease, background 0.3s;
        }

        .metric-fill.green { background: #3fb950; }
        .metric-fill.yellow { background: #d29922; }
        .metric-fill.red { background: #f85149; }

        .metric-val {
            font-size: 0.8em;
            font-variant-numeric: tabular-nums;
            width: 48px;
            text-align: right;
            flex-shrink: 0;
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 4px;
        }

        .alert-item + .alert-item { border-top: 1px solid #21262d; }

        .alert-sev {
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .alert-sev.critical { background: #f8514933; color: #f85149; }
        .alert-sev.warning { background: #d2992233; color: #d29922; }
        .alert-sev.info { background: #3fb95033; color: #3fb950; }

        .alert-text { font-size: 0.8em; line-height: 1.4; }
        .alert-name { font-weight: 600; }
        .alert-desc { color: #8b949e; font-size: 0.9em; }

        .no-alerts {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #3fb950;
            font-size: 0.9em;
            gap: 8px;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0d1117;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }

        .stat-pill .val {
            color: #e6edf3;
            font-weight: 600;
        }

        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-track { background: transparent; }
        .panel-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto auto;
            }
            .services-panel { grid-row: auto; }
        }
    </style>
</head>

<div class="layout">

                <div class="view-tabs">
                    <button class="view-tab active" id="tab-services" onclick="switchView('services')">Services</button>
                    <button class="view-tab" id="tab-routes" onclick="switchView('routes')">Routes</button>
                </div>
            </div>
        </div>
        <div class="panel-body">
            <div class="services-grid" id="services-grid"></div>
            <div id="routes-view" style="display:none;">
                <table class="routes-table" id="routes-table"></table>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">Cluster Metrics</div>

            <div class="metric-row">

                <div class="metric-bar"><div class="metric-fill green" id="cpu-fill" style="width: 0%"></div></div>
                <span class="metric-val" id="cpu-val">--%</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Memory</span>
                <div class="metric-bar"><div class="metric-fill green" id="mem-fill" style="width: 0%"></div></div>
                <span class="metric-val" id="mem-val">--%</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Disk /</span>
                <div class="metric-bar"><div class="metric-fill green" id="disk-fill" style="width: 0%"></div></div>
                <span class="metric-val" id="disk-val">--%</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Containers</span>
                <div class="metric-bar"><div class="metric-fill green" id="ct-fill" style="width: 0%"></div></div>
                <span class="metric-val" id="ct-val">--</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Uptime</span>
                <div class="metric-bar"><div class="metric-fill green" style="width: 100%"></div></div>
                <span class="metric-val" id="uptime-val">--d</span>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">Active Alerts</div>
        <div class="panel-body" id="alerts-body">
            <div class="no-alerts" id="no-alerts">All clear</div>
        </div>
    </div>
</div>

            { sub: 'resume.woodhead.tech',       backend: '192.168.86.25',   port: '3081',  auth: 'sso',  note: 'Resume' },
            { sub: 'v2mom.woodhead.tech',        backend: '192.168.86.25',   port: '8087',  auth: 'sso',  note: 'V2MOM' },
            { sub: 'consulting.woodhead.tech',   backend: '192.168.86.25',   port: '8085',  auth: 'none', note: 'Consulting (fallback)' },
        ]},
    ];

    function switchView(view) {
        var svcGrid = document.getElementById('services-grid');
        var routesView = document.getElementById('routes-view');
        var tabSvc = document.getElementById('tab-services');
        var tabRoutes = document.getElementById('tab-routes');

        if (view === 'routes') {
            svcGrid.style.display = 'none';
            routesView.style.display = 'block';
            tabSvc.classList.remove('active');
            tabRoutes.classList.add('active');
            renderRoutes();
        } else {
            svcGrid.style.display = 'grid';
            routesView.style.display = 'none';
            tabSvc.classList.add('active');
            tabRoutes.classList.remove('active');
        }
    }

    function renderRoutes() {
        var tbl = document.getElementById('routes-table');
        while (tbl.firstChild) tbl.removeChild(tbl.firstChild);

        var thead = document.createElement('thead');
        var hr = document.createElement('tr');
        ['Subdomain', 'Backend', 'Port', 'Auth', 'Notes'].forEach(function (h) {
            var th = document.createElement('th');
            th.textContent = h;
            hr.appendChild(th);
        });
        thead.appendChild(hr);
        tbl.appendChild(thead);

        var tbody = document.createElement('tbody');

        ROUTE_GROUPS.forEach(function (group) {
            var gr = document.createElement('tr');
            gr.className = 'route-group-row';
            var gd = document.createElement('td');
            gd.colSpan = 5;
            gd.textContent = group.label;
            gr.appendChild(gd);
            tbody.appendChild(gr);

            group.routes.forEach(function (r) {
                var row = document.createElement('tr');
                [r.sub, r.backend, r.port].forEach(function (v) {
                    var td = document.createElement('td');
                    td.textContent = v;
                    row.appendChild(td);
                });

                var authTd = document.createElement('td');
                var badge = document.createElement('span');
                badge.className = 'auth-badge ' + r.auth;
                badge.textContent = r.auth === 'sso' ? 'SSO' : r.auth === 'own' ? 'Own' : 'None';
                authTd.appendChild(badge);
                row.appendChild(authTd);

                var noteTd = document.createElement('td');
                noteTd.textContent = r.note;
                noteTd.style.color = '#8b949e';
                row.appendChild(noteTd);

                tbody.appendChild(row);
            });
        });

        tbl.appendChild(tbody);
    }

    var serviceStatus = {};

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
    }

    function renderServices() {
        var grid = document.getElementById('services-grid');
        while (grid.firstChild) grid.removeChild(grid.firstChild);

        SERVICE_GROUPS.forEach(function (group) {
            var hdr = el('div', 'svc-group-header' + (group.demo ? ' demos' : ''), group.label);
            grid.appendChild(hdr);

            group.items.forEach(function (svc) {
                var card = document.createElement(svc.url && !svc.paused ? 'a' : 'div');
                card.className = 'svc' + (svc.paused ? ' paused' : '');
                if (svc.url && !svc.paused) card.href = svc.url;

                var dotState = svc.paused ? 'paused' : (serviceStatus[svc.name] || 'unknown');
                var dot = el('div', 'svc-dot ' + dotState);
                var info = el('div', 'svc-info');
                info.appendChild(el('div', 'svc-name', svc.name));
                info.appendChild(el('div', 'svc-sub', svc.sub));
                card.appendChild(dot);
                card.appendChild(info);
                grid.appendChild(card);
            });
        });
    }

    function fetchStatus() {
        fetch('/api/prometheus/targets?state=active')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var targets = data.data.activeTargets || [];
                var jobHealth = {};
                targets.forEach(function (t) {
                    var job = t.labels.job || '';
                    if (!jobHealth[job] || t.health === 'up') {
                        jobHealth[job] = t.health;
                    }
                });

                SERVICES.forEach(function (svc) {
                    if (svc.job && jobHealth[svc.job]) {
                        serviceStatus[svc.name] = jobHealth[svc.job] === 'up' ? 'up' : 'down';
                    }
                });

                return fetch('/api/prometheus/query?query=probe_success');
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var results = data.data.result || [];
                results.forEach(function (r) {
                    var target = r.metric.instance || '';
                    var val = parseFloat(r.value[1]);
                    SERVICES.forEach(function (svc) {
                        if (svc.url && target.indexOf(svc.url.replace('https://', '')) >= 0) {
                            serviceStatus[svc.name] = val === 1 ? 'up' : 'down';
                        }
                    });
                });

                var up = 0, total = 0;
                SERVICES.forEach(function (svc) {
                    var s = serviceStatus[svc.name];
                    if (s === 'up' || s === 'down') {
                        total++;
                        if (s === 'up') up++;
                    }
                });
                document.getElementById('svc-count').textContent = up + '/' + total;
                document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
                renderServices();
            })
            .catch(function () {
                renderServices();
            });
    }

    function setMetric(id, pct) {
        var fill = document.getElementById(id + '-fill');
        var valEl = document.getElementById(id + '-val');
        fill.style.width = pct + '%';
        valEl.textContent = pct + '%';
        fill.className = 'metric-fill ' + (pct > 85 ? 'red' : pct > 65 ? 'yellow' : 'green');
    }

    function fetchMetrics() {
        var queries = [
            { id: 'cpu', query: '100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)' },
            { id: 'mem', query: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100' },
            { id: 'disk', query: '(1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100' },
            { id: 'uptime', query: 'node_time_seconds - node_boot_time_seconds' },
        ];

        queries.forEach(function (q) {
            fetch('/api/prometheus/query?query=' + encodeURIComponent(q.query))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var results = data.data.result || [];
                    if (results.length === 0) return;
                    var val = parseFloat(results[0].value[1]);

                    if (q.id === 'uptime') {
                        document.getElementById('uptime-val').textContent = Math.floor(val / 86400) + 'd';
                        return;
                    }
                    setMetric(q.id, Math.round(val));
                })
                .catch(function () {});
        });

        fetch('/api/prometheus/query?query=' + encodeURIComponent('count(container_last_seen{name!=""})'))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var results = data.data.result || [];
                if (results.length > 0) {
                    var count = parseInt(results[0].value[1]);
                    document.getElementById('container-count').textContent = count;
                    document.getElementById('ct-val').textContent = count;
                    var pct = Math.min(100, Math.round((count / 20) * 100));
                    document.getElementById('ct-fill').style.width = pct + '%';
                }
            })
            .catch(function () {});
    }

    function fetchAlerts() {
        fetch('/api/alertmanager/alerts?active=true&silenced=false&inhibited=false')
            .then(function (r) { return r.json(); })
            .then(function (alerts) {
                var body = document.getElementById('alerts-body');
                while (body.firstChild) body.removeChild(body.firstChild);
                document.getElementById('alert-count').textContent = alerts.length;

                if (alerts.length === 0) {
                    var clear = el('div', 'no-alerts', 'All clear');
                    body.appendChild(clear);
                    return;
                }

                alerts.forEach(function (a) {
                    var sev = (a.labels && a.labels.severity) || 'warning';
                    var name = (a.labels && a.labels.alertname) || 'Unknown';
                    var desc = '';
                    if (a.annotations) {
                        desc = a.annotations.description || a.annotations.summary || '';
                    }

                    var item = el('div', 'alert-item');
                    item.appendChild(el('span', 'alert-sev ' + sev, sev));
                    var text = el('div', 'alert-text');
                    text.appendChild(el('div', 'alert-name', name));
                    text.appendChild(el('div', 'alert-desc', desc));
                    item.appendChild(text);
                    body.appendChild(item);
                });
            })
            .catch(function () {
                document.getElementById('alert-count').textContent = '?';
            });
    }

    function updateClock() {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', {
            hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }

    renderServices();
    fetchStatus();
    fetchMetrics();
    fetchAlerts();
    updateClock();

    setInterval(updateClock, 1000);
    setInterval(function () {
        fetchStatus();
        fetchMetrics();
        fetchAlerts();
    }, 30000);
</script>

</body>
</html>
